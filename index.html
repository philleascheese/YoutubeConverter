<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embedder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .video-container {
            margin-top: 15px;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Desktop aspect ratios */
        .standard-video {
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .shorts-video {
            aspect-ratio: 9 / 16;
            width: 315px; /* Standard Shorts width */
            height: 560px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until a valid link is added */
        }
    </style>
</head>
<body>

    <h2>YouTube Video Embedder</h2>

    <!-- Standard Video Input -->
    <div class="input-group">
        <label for="standardInput">Paste Standard YouTube URL:</label>
        <input type="text" id="standardInput" placeholder="https://youtube.com">
        <div class="video-container standard-video">
            <iframe id="standardPlayer" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Shorts Video Input -->
    <div class="input-group">
        <label for="shortsInput">Paste YouTube Shorts URL:</label>
        <input type="text" id="shortsInput" placeholder="https://youtube.com">
        <div class="video-container shorts-video">
            <iframe id="shortsPlayer" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Function to extract YouTube ID from virtually any layout
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Function to update the iframe source
        function handleVideoEmbed(inputId, iframeId) {
            const input = document.getElementById(inputId);
            const iframe = document.getElementById(iframeId);

            input.addEventListener('input', (e) => {
                const url = e.target.value.trim();
                const videoId = getYouTubeId(url);

                if (videoId) {
                    iframe.src = `https://youtube.com{videoId}`;
                    iframe.style.display = 'block';
                } else {
                    iframe.src = '';
                    iframe.style.display = 'none';
                }
            });
        }

        // Initialize listeners for both inputs
        handleVideoEmbed('standardInput', 'standardPlayer');
        handleVideoEmbed('shortsInput', 'shortsPlayer');
    </script>

</body>
</html>
